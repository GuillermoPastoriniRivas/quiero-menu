name: Deploy quiero-menu to shared ARM host

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_API: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/quiero-menu/api
  APP_DIR: /home/ubuntu/shared

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Lint API
        working-directory: api
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Unit tests API
        working-directory: api
        run: npm test -- --silent --runInBand

  deploy:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ARM API
        run: |
          docker buildx build --platform linux/arm64 --push \
            -t ${{ env.ECR_API }}:${{ github.sha }} \
            -t ${{ env.ECR_API }}:latest ./api

      - name: Build static UI
        working-directory: ui
        env:
          NEXT_PUBLIC_API_URL: https://quiero.menu/api
        run: |
          npm ci
          npm run build
          tar -czf ../quiero-menu-static.tar.gz -C out .

      - name: Copy static UI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SHARED_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SHARED_EC2_SSH_KEY }}
          source: "quiero-menu-static.tar.gz,infra/scripts/hydrate-env.sh"
          target: ${{ env.APP_DIR }}

      - name: Activate quiero-menu API and static UI
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SHARED_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SHARED_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.APP_DIR }}
            mkdir -p static/quiero-menu quiero-menu/api nginx-enabled certbot

            chmod +x infra/scripts/hydrate-env.sh
            bash infra/scripts/hydrate-env.sh /quiero-menu/api ./quiero-menu/api/.env
            test -s ./quiero-menu/api/.env
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull ${{ env.ECR_API }}:latest
            docker tag ${{ env.ECR_API }}:latest shared-quiero-menu-api:latest

            rm -rf static/quiero-menu
            mkdir -p static/quiero-menu
            tar -xzf quiero-menu-static.tar.gz -C static/quiero-menu

            docker compose -f docker-compose.yml up -d --no-deps quiero-menu-api

            if ! sudo test -f /etc/letsencrypt/live/quiero.menu/fullchain.pem; then
              sudo certbot certonly --webroot -w "$PWD/certbot" --non-interactive --agree-tos \
                -m "${{ secrets.TLS_EMAIL }}" --keep-until-expiring \
                -d quiero.menu -d www.quiero.menu
            fi

            cp infra/nginx/shared/20-quiero-menu.conf nginx-enabled/
            docker exec shared-nginx nginx -t
            docker exec shared-nginx nginx -s reload

            rm -f quiero-menu-static.tar.gz
            docker image prune -f

      - name: Verify quiero-menu is serving
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://quiero.menu/api/v1/health || true)
            [ "$code" = "200" ] && echo "quiero.menu/api/v1/health OK" && exit 0
            sleep 6
          done
          echo "quiero.menu/api/v1/health no respondió 200 (último: ${code:-sin respuesta})"
          exit 1