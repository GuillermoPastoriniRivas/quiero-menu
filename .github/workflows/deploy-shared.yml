name: Deploy quiero-menu to shared ARM host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_API: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/quiero-menu/api
  ECR_UI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/quiero-menu/ui
  APP_DIR: /home/ubuntu/shared

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Lint API
        working-directory: api
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Unit tests API
        working-directory: api
        run: npm test -- --silent --runInBand

  deploy:
    needs: [lint, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ARM API
        run: |
          docker buildx build --platform linux/arm64 --push \
            -t ${{ env.ECR_API }}:${{ github.sha }} \
            -t ${{ env.ECR_API }}:latest ./api

      - name: Build and push ARM UI (SSR standalone)
        run: |
          docker buildx build --platform linux/arm64 --push \
            --build-arg NEXT_PUBLIC_API_URL=https://quiero.menu/api \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }} \
            -t ${{ env.ECR_UI }}:${{ github.sha }} \
            -t ${{ env.ECR_UI }}:latest ./ui

      - name: Copy configs and scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SHARED_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SHARED_EC2_SSH_KEY }}
          source: "infra/scripts/hydrate-env.sh,infra/nginx/shared/20-quiero-menu.conf"
          target: ${{ env.APP_DIR }}

      - name: Deploy API and UI containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SHARED_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SHARED_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.APP_DIR }}
            mkdir -p quiero-menu/api nginx-enabled certbot

            chmod +x infra/scripts/hydrate-env.sh
            bash infra/scripts/hydrate-env.sh /quiero-menu/api ./quiero-menu/api/.env
            test -s ./quiero-menu/api/.env
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

            docker pull ${{ env.ECR_API }}:latest
            docker tag ${{ env.ECR_API }}:latest shared-quiero-menu-api:latest
            docker pull ${{ env.ECR_UI }}:latest
            docker tag ${{ env.ECR_UI }}:latest shared-quiero-menu-ui:latest

            docker compose -f docker-compose.yml up -d --no-deps quiero-menu-api
            docker compose -f docker-compose.yml up -d --no-deps quiero-menu-ui

            # Esperar a que la UI responda antes de apuntarle nginx
            for i in $(seq 1 30); do
              ok=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/ || true)
              [ "$ok" = "200" ] && break
              sleep 4
            done

            if ! sudo test -f /etc/letsencrypt/live/quiero.menu/fullchain.pem; then
              sudo certbot certonly --webroot -w "$PWD/certbot" --non-interactive --agree-tos \
                -m "${{ secrets.TLS_EMAIL }}" --keep-until-expiring \
                -d quiero.menu -d www.quiero.menu
            fi

            cp infra/nginx/shared/20-quiero-menu.conf nginx-enabled/
            docker exec shared-nginx nginx -t
            docker exec shared-nginx nginx -s reload

            docker image prune -f

      - name: Verify quiero-menu is serving
        run: |
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://quiero.menu/api/v1/health || true)
            root=$(curl -s -o /dev/null -w '%{http_code}' https://quiero.menu/ || true)
            if [ "$code" = "200" ] && [ "$root" = "200" ]; then
              echo "quiero.menu OK (api=$code root=$root)"
              exit 0
            fi
            sleep 6
          done
          echo "quiero.menu no respondió 200 (api=${code:-sin respuesta}, root=${root:-sin respuesta})"
          exit 1