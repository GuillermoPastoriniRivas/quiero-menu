<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#E8532C"/>
  <!-- Simplified QR for favicon - 17x17 modules -->
  <g fill="#fff" opacity="0.95" transform="translate(14 14)">
    <!-- Finder patterns -->
    <rect x="0" y="0" width="7" height="7"/>
    <rect x="1" y="1" width="5" height="5" fill="#E8532C"/>
    <rect x="2" y="2" width="3" height="3"/>
    <rect x="10" y="0" width="7" height="7"/>
    <rect x="11" y="1" width="5" height="5" fill="#E8532C"/>
    <rect x="12" y="2" width="3" height="3"/>
    <rect x="0" y="10" width="7" height="7"/>
    <rect x="1" y="11" width="5" height="5" fill="#E8532C"/>
    <rect x="2" y="12" width="3" height="3"/>
    <!-- Center alignment pattern -->
    <rect x="5" y="5" width="5" height="5" fill="#E8532C"/>
    <rect x="6" y="6" width="3" height="3"/>
    <rect x="7" y="7" width="1" height="1" fill="#E8532C"/>
  </g>
</svg>